name: CI

# Spec 102 D4. One job; every extra installed so nothing skips for a missing package.
# Required status check for `main` (the job id `test` is the check name).
#
# Docs-only PRs (spec 102 A2): the workflow still triggers on every PR, because a workflow
# skipped by a path filter leaves its required check Pending and blocks merging. Instead the
# `changes` step below sets `code=false` when every changed file is docs, and only the full
# test suite is skipped (a job skipped by `if:` reports success).
# RULE THAT KEEPS THIS SAFE: a test that reads a Markdown file lives in tests/test_docs.py or
# tests/test_notebooks.py, the two files that always run.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]  # tests/test_scaffold.py checks the tag against the package version
  schedule:
    # Weekly, Monday 06:00 UTC, on the default branch. An upstream break opens an issue
    # (see the last step) instead of emailing whoever last edited this cron line.
    # GitHub disables scheduled runs after 60 days without repository activity.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write  # only used by the weekly auto-issue step; fork PRs never get it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: List changed files and decide whether the full suite runs
        id: changes
        # Everything except a pull_request defaults to code=true (push to main, the weekly run,
        # workflow_dispatch), and so does a failure of the listing itself. Two-dot diff against
        # the merge commit GitHub checked out; three-dot fails under a depth-1 fetch with
        # "no merge base" (CPython bpo-40548).
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            if git fetch origin "$BASE_REF" --depth=1 \
               && git diff --name-only --no-renames "origin/$BASE_REF.." > changed-files.txt \
               && result=$(python scripts/ci_changed_paths.py < changed-files.txt); then
              code=$result
            else
              echo "::warning::listing changed files failed; running the full suite"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full suite needed: $code"
      - name: Install rise-eo with every extra
        run: pip install -e ".[dev,local,s3,notebooks,grid,azure,aml,mpc,titiler,serving]" pytest-reportlog
      - name: Lint
        run: ruff check src/ tests/
      - name: Docs guards (always run)
        run: pytest -q tests/test_docs.py tests/test_notebooks.py
      - name: Docs call sites match live signatures
        run: python scripts/docs_kwarg_sweep.py
      - name: Tests (the `network` marker is opt-in, so it stays off)
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: pytest -q -rs --report-log=pytest-log.jsonl --ignore=tests/test_docs.py --ignore=tests/test_notebooks.py
      - name: Open an issue when the weekly run fails
        if: failure() && github.event_name == 'schedule'
        # Precedent: xarray's upstream-dev-ci.yaml (spec 102 section 7), which pins this same SHA.
        # Its `v1` ref is a branch that lags the latest tag, so pin the release commit instead.
        # A missing log (lint or install failed first) still opens an issue, without test details.
        uses: scientific-python/issue-from-pytest-log-action@35b4e0a9e06f8e7e261778289cf4b968b722662d # v1.6.2
        with:
          log-path: pytest-log.jsonl
          issue-title: "Weekly CI run failed"
          # The action's default label `CI` does not exist here, and `gh issue create` fails on
          # an unknown label. `bug` is a GitHub default label.
          issue-label: bug
