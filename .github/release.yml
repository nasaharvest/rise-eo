# Release notes are generated from merged PR titles, grouped by label (spec 102 D15).
# Whoever merges (the maintainer, or an agent session they authorised) applies one label per PR.
changelog:
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature]
    - title: Fixes
      labels: [fix]
    - title: Documentation
      labels: [docs]
    - title: Internal
      labels: [internal]
    - title: Other changes
      labels: ["*"]
